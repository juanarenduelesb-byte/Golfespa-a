name: Actualizar resultados

on:
  schedule:
    # Hora UTC (Madrid = +1 en invierno). GitHub a veces retrasa o se salta estas tareas, por eso hay
    # una pasada temprana y otras cada 2 horas: la primera que llegue cada día guarda la fecha nueva,
    # y las demás solo guardan si hay resultados nuevos (si no, terminan en segundos sin tocar nada).
    - cron: '23 5 * * *'
    - cron: '41 7-21/2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Python 3 y Node ya vienen instalados en la máquina de GitHub; no hace falta nada más.
      - name: Leer clasificaciones
        id: leer
        run: python3 pipeline/actualizar.py

      - name: Validar
        run: node pipeline/validar.mjs

      - name: Guardar (Cloudflare publica solo al ver el cambio)
        run: |
          if [ "${{ steps.leer.outputs.cambios }}" != "1" ] && [ "${{ steps.leer.outputs.nuevo_dia }}" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Sin resultados nuevos y la fecha ya es la de hoy: no se guarda nada"; exit 0; fi
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add site/auto.js
          git diff --cached --quiet && { echo "Nada que guardar"; exit 0; }
          git commit -m "Resultados $(TZ=Europe/Madrid date '+%d/%m %H:%M')"
          # Si alguien ha guardado otro cambio mientras tanto, se coloca encima y se reintenta.
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          echo "::error::No se pudo guardar en GitHub"; exit 1
