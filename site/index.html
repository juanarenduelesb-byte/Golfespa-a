<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Españolas · Golf femenino</title>
<meta name="description" content="Las golfistas españolas en la NCAA y en el circuito nacional: calendario, resultados, marcador en vivo y ranking.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0a6b76">
<script src="/auto.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: glass sidebar of players + glass main pane over a soft fairway/sky field; segmented tabs per player */
:root{
  --bg:#edf2f3; --blob1:#86dcd3; --blob2:#a9bcff; --blob3:#ffd0b0;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-edge:rgba(255,255,255,.8); --glass-shadow:0 10px 40px rgba(12,20,22,.10);
  --fg:#0c1416; --fg2:#56646a; --fg3:#56646a; --line:rgba(12,20,22,.09);
  --accent:#0a6b76; --accent-soft:rgba(10,107,118,.12);
  --win:#7e520d; --win-soft:rgba(126,82,13,.12);
  --live:#b83232; --live-soft:rgba(184,50,50,.12);
  --info:#0a6b76; --info-soft:rgba(10,107,118,.12);
  --over:#56646a; --under:#166b3b;
  --font:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-display:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r-lg:30px; --r-md:22px; --r-sm:12px; --shine:rgba(255,255,255,.95); --on-accent:#fff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06090a; --blob1:#0e5753; --blob2:#25357e; --blob3:#563022;
  --glass:rgba(26,33,36,.5); --glass-strong:rgba(32,40,44,.78); --glass-edge:rgba(255,255,255,.12); --glass-shadow:0 10px 40px rgba(0,0,0,.45);
  --fg:#edf3f4; --fg2:#93a2a7; --fg3:#93a2a7; --line:rgba(255,255,255,.08);
  --accent:#5ed3c8; --accent-soft:rgba(94,211,200,.14);
  --win:#f2c35b; --win-soft:rgba(242,195,91,.14);
  --live:#f57a7a; --live-soft:rgba(245,122,122,.14);
  --info:#5ed3c8; --info-soft:rgba(94,211,200,.14);
  --over:#93a2a7; --under:#58d68d; --shine:rgba(255,255,255,.16); --on-accent:#03201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06090a; --blob1:#0e5753; --blob2:#25357e; --blob3:#563022;
  --glass:rgba(26,33,36,.5); --glass-strong:rgba(32,40,44,.78); --glass-edge:rgba(255,255,255,.12); --glass-shadow:0 10px 40px rgba(0,0,0,.45);
  --fg:#edf3f4; --fg2:#93a2a7; --fg3:#93a2a7; --line:rgba(255,255,255,.08);
  --accent:#5ed3c8; --accent-soft:rgba(94,211,200,.14);
  --win:#f2c35b; --win-soft:rgba(242,195,91,.14);
  --live:#f57a7a; --live-soft:rgba(245,122,122,.14);
  --info:#5ed3c8; --info-soft:rgba(94,211,200,.14);
  --over:#93a2a7; --under:#58d68d; --shine:rgba(255,255,255,.16); --on-accent:#03201d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
.field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.field i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9}
.field i{animation:drift 32s ease-in-out infinite alternate}.field i:nth-child(2){animation-duration:26s}.field i:nth-child(3){animation-duration:38s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,4vh) scale(1.08)}}
:focus-visible{outline-offset:3px!important}
.who h2,.brand h1,.cal-title{text-wrap:balance}
.field i:nth-child(1){width:55vw;height:55vw;left:-12vw;top:-14vw;background:var(--blob1)}
.field i:nth-child(2){width:50vw;height:50vw;right:-14vw;top:8vh;background:var(--blob2)}
.field i:nth-child(3){width:42vw;height:42vw;left:28vw;bottom:-20vw;background:var(--blob3)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:20px 40px}
.glass{background:linear-gradient(135deg,color-mix(in srgb,var(--shine) 30%,transparent) 0%,transparent 45%),var(--glass);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-edge);border-radius:var(--r-lg)}

/* Sidebar */
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 40px);display:flex;flex-direction:column;padding:18px 12px 12px;min-width:0;overflow-y:auto;overflow-x:hidden}
.brand{padding:0 8px 12px}
.brand h1{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--fg2);font-size:12.5px}
.search{margin:0 6px 10px;display:flex;align-items:center;gap:8px;background:var(--line);border-radius:11px;padding:7px 10px}
.search input{all:unset;flex:1;font-size:13.5px;color:var(--fg)}
.search input::placeholder{color:var(--fg3)}
.list{overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:2px;scrollbar-width:thin;min-height:60px;flex:1 1 auto}
.p-item{all:unset;cursor:pointer;display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;transition:background .2s}
.p-item:hover{background:var(--line)}
.p-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.p-item[aria-current="true"]{background:var(--glass-strong);box-shadow:0 2px 10px rgba(0,0,0,.06),inset 0 0 0 1px var(--glass-edge)}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:12.5px;color:var(--accent);background:var(--accent-soft);letter-spacing:.02em}
.p-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-uni{font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-rank{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-left:6px;vertical-align:1px;box-shadow:0 0 0 3px var(--live-soft)}
.nav{display:flex;flex-direction:column;gap:3px;padding:0 6px 12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:14px;transition:background .2s}
.nav button:hover{background:var(--line)}
.nav button[aria-current="true"]{background:var(--glass-strong);box-shadow:0 2px 10px rgba(0,0,0,.06),inset 0 0 0 1px var(--glass-edge)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--line);color:var(--fg2);flex:none}
.nav .ic svg{width:17px;height:17px}
.nav button[aria-current="true"] .ic{background:var(--accent);color:var(--on-accent)}
.nav button>span:last-child>span{display:block;font-weight:600;font-size:13.5px}
.nav small{display:block;font-weight:500;font-size:11.5px;color:var(--fg3);margin-top:1px}
.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);font-weight:650;padding:0 12px 7px}

/* Main */
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{padding:24px 26px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.hero .av{width:58px;height:58px;font-size:19px}
.who{display:flex;gap:16px;align-items:center;min-width:0}
.who h2{font-family:var(--font-display);font-size:clamp(24px,3.4vw,34px);line-height:1.05;letter-spacing:-.025em;margin:0;font-weight:700;text-wrap:balance}
.who .meta{color:var(--fg2);margin-top:5px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--line);color:var(--fg2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
button.chip{border:0;font-family:inherit}
.chip.win{background:var(--win-soft);color:var(--win)}
.chip.live{background:var(--live-soft);color:var(--live)}
.chip.info{background:var(--info-soft);color:var(--info)}

.seg{display:inline-flex;padding:4px;gap:2px;border-radius:14px;align-self:flex-start;max-width:100%;overflow-x:auto}
.seg button{all:unset;cursor:pointer;padding:8px 16px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--fg2);white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-selected="true"]{background:var(--glass-strong);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--accent)}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{padding:16px 18px;border-radius:var(--r-md)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600}
.big{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.1}
.sub{color:var(--fg2);font-size:12.5px;margin-top:3px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:20px 22px;border-radius:var(--r-lg);min-width:0}
.card h3{margin:0 0 12px;font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h3 small{font-weight:500;color:var(--fg3);font-size:12px}
.ev-name{font-size:18px;font-weight:650;letter-spacing:-.015em;text-wrap:balance}
.ev-meta{color:var(--fg2);font-size:13px;margin-top:2px}
.ev-row{display:flex;flex-wrap:wrap;gap:22px;margin-top:14px}
.ev-row .big{font-size:26px}
.rounds{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.rd{padding:6px 10px;border-radius:10px;background:var(--line);font-variant-numeric:tabular-nums;font-size:12.5px}
.rd b{font-weight:650}
.under{color:var(--under)} .over{color:var(--fg2)} .even{color:var(--fg)}
.countdown{font-family:var(--font-display);font-size:42px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.upnext{display:flex;flex-direction:column;gap:2px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.upnext div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0}
.upnext span:last-child{color:var(--fg3);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--fg2);font-size:13.5px;padding:6px 0}

.chart svg{display:block;width:100%;height:auto}
.chart .tick{fill:var(--fg3);font-size:11px}
.chart .axis{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;padding:8px 10px;border-radius:10px;font-size:12px;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);white-space:nowrap}

/* Calendar */
.month{margin-top:6px}
.month h4{margin:14px 4px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:650}
.month:first-child h4{margin-top:0}
.evrow{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;transition:background .2s}
.evrow+.evrow{border-top:1px solid var(--line);border-radius:0}
.date{text-align:center;line-height:1.05}
.date b{display:block;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.date span{font-size:10.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em}
.evrow .t{font-weight:600;font-size:14px}
.evrow .l{font-size:12.5px;color:var(--fg2)}
.evrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.evrow .res{font-variant-numeric:tabular-nums;font-size:13px;font-weight:650}
.evrow.past .t{color:var(--fg)} .evrow.skip{opacity:.62}

/* Table */
.tablewrap{overflow-x:auto;margin:0 -6px}
table{border-collapse:collapse;width:100%;min-width:720px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);font-weight:650;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td .pos{font-weight:700;font-size:15px}
a{color:var(--accent);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--accent);border-radius:4px}

/* Profile */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.fact{padding:14px 16px;border-radius:var(--r-md);background:var(--line)}
.fact .v{font-weight:650;font-size:15px;margin-top:4px}
.hl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.hl li{padding-left:18px;position:relative;max-width:68ch}
.hl li::before{content:"";position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.note{color:var(--fg3);font-size:12px;max-width:80ch}
.src{display:flex;flex-direction:column;gap:6px;font-size:13px}

.now-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.now{padding:14px 16px;border-radius:var(--r-md);cursor:pointer;display:flex;flex-direction:column;gap:9px;border:1px solid transparent;transition:border-color .2s,transform .15s}
.now:hover{border-color:var(--glass-edge);transform:translateY(-2px)}
.now:focus-visible{outline:2px solid var(--accent)}
.now .top{display:flex;align-items:center;gap:10px;min-width:0}
.now .av{width:32px;height:32px;font-size:11.5px}
.now .nm{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .un{font-size:12px;color:var(--fg2)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 50%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.att button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--line);font-size:12px;font-weight:600;transition:background .2s,color .2s}
.att button:hover{background:var(--accent-soft);color:var(--accent)}
.att button:focus-visible{outline:2px solid var(--accent)}
.att .mini{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none}
.att .rr{color:var(--fg3);font-weight:600;font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--line)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cal-title{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.cal-nav{display:flex;align-items:center;gap:6px}
.navbtn{all:unset;box-sizing:border-box;cursor:pointer;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--line);color:var(--fg);transition:background .2s,color .2s}
.navbtn:hover{background:var(--accent-soft);color:var(--accent)}
.navbtn[aria-disabled="true"]{opacity:.3;pointer-events:none}
.navbtn:focus-visible,.today-btn:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.today-btn{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 15px;border-radius:11px;background:var(--line);font-weight:600;font-size:13px;transition:background .2s,color .2s}
.today-btn:hover{background:var(--accent-soft);color:var(--accent)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.dow span{text-align:center;font-size:11px;font-weight:650;letter-spacing:.06em;color:var(--fg3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{min-height:94px;border-radius:14px;background:var(--line);padding:6px;display:flex;flex-direction:column;gap:5px;min-width:0;overflow:hidden}
.cell.blank{background:transparent}
.cell .dn{font-size:12.5px;font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;flex:none}
.cell.today .dn{background:var(--accent);color:var(--on-accent)}
.pill{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;background:var(--accent-soft);color:var(--accent);min-width:0}
.pill .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .dot{display:none;width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.past{background:var(--line);color:var(--fg2)}
.pill.live{background:var(--live-soft);color:var(--live)}
.pill.more{background:transparent;color:var(--fg3);padding:0 7px}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}20%{box-shadow:0 0 0 2px var(--accent)}}
@media (max-width:560px){
 .cell{min-height:58px;padding:4px;gap:3px}
 .cell .dn{width:20px;height:20px;font-size:11px}
 .pill{padding:0;background:transparent!important}
 .pill .lbl{display:none}
 .pill .dot{display:block}
 .pill.more{display:none}
 .cal-title{font-size:19px}
}
.crest{border-radius:6px;display:inline-grid;place-items:center;color:#fff;font-weight:700;letter-spacing:.01em;flex:none;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);vertical-align:middle}
.p-uni{display:flex;align-items:center;gap:6px}
.live-card{padding:20px 22px;border-radius:var(--r-lg);min-width:0}
.live-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge-live{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--live-soft);color:var(--live);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.scorecard{width:100%;border-collapse:collapse;margin-top:14px;font-variant-numeric:tabular-nums;min-width:280px}
.scorecard th,.scorecard td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
.scorecard th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);font-weight:650}
.scorecard td{font-weight:650;font-size:15px}
.scorecard .lbl2{text-align:left;font-weight:600;font-size:12px;color:var(--fg2);text-transform:none;letter-spacing:0}
.scorecard .tot{font-weight:800}
.scorecard td.cur{color:var(--live)}
